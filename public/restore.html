<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restore backup – Firefly</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
    p { color: #64748b; font-size: 0.875rem; margin-bottom: 1rem; }
    textarea { width: 100%; height: 160px; padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 8px; font-family: monospace; font-size: 12px; }
    .row { display: flex; gap: 0.75rem; align-items: center; margin-top: 1rem; flex-wrap: wrap; }
    button { padding: 0.5rem 1rem; border-radius: 8px; font-weight: 500; cursor: pointer; border: none; }
    .primary { background: #6366f1; color: white; }
    .primary:hover { background: #4f46e5; }
    .secondary { background: #f1f5f9; color: #334155; }
    .secondary:hover { background: #e2e8f0; }
    input[type="file"] { font-size: 0.875rem; }
    .msg { margin-top: 1rem; padding: 0.75rem; border-radius: 8px; font-size: 0.875rem; }
    .msg.ok { background: #dcfce7; color: #166534; }
    .msg.err { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <h1>Restore holdings from backup</h1>
  <p>Paste your backup JSON below or choose a file. It should be an array of holdings or an object with <code>ukHoldings</code>. This will replace the current holdings in the app.</p>
  <textarea id="input" placeholder='Paste JSON here, e.g. [{"name":"...", "symbol":"...", ...}] or {"ukHoldings": [...]}'></textarea>
  <div class="row">
    <input type="file" id="file" accept=".json,application/json" />
    <button type="button" class="primary" id="restore">Restore to app</button>
    <button type="button" class="secondary" id="go">Open app</button>
  </div>
  <div id="msg"></div>

  <script>
    const STORAGE_KEY = 'personal-fin-app-state';

    function showMsg(text, isError) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg ' + (isError ? 'err' : 'ok');
    }

    function parseInput(raw) {
      const trimmed = (raw || '').trim();
      if (!trimmed) return null;
      try {
        const data = JSON.parse(trimmed);
        if (Array.isArray(data)) return { ukHoldings: data };
        if (data && Array.isArray(data.ukHoldings)) return { ukHoldings: data.ukHoldings };
        if (data && Array.isArray(data.uk)) return { ukHoldings: data.uk };
        return null;
      } catch {
        return null;
      }
    }

    document.getElementById('file').onchange = function (e) {
      const f = e.target.files?.[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        document.getElementById('input').value = r.result;
      };
      r.readAsText(f);
    };

    document.getElementById('restore').onclick = function () {
      const raw = document.getElementById('input').value;
      const payload = parseInput(raw);
      if (!payload || !payload.ukHoldings.length) {
        showMsg('Invalid or empty JSON. Use an array of holdings or an object with ukHoldings.', true);
        return;
      }
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        showMsg('Restored ' + payload.ukHoldings.length + ' holdings. Reload the app (or click Open app) to see them.');
      } catch (err) {
        showMsg('Could not save: ' + (err?.message || 'unknown error'), true);
      }
    };

    document.getElementById('go').onclick = function () {
      window.location.href = '/';
    };
  </script>
</body>
</html>
